<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yönetim · Boncuk Atölyesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--paper:#fbfaf7;--card:#fff;--ink:#1b2030;--muted:#5d6577;--hair:#d8dce5;--soft:#f1f0ec;--accent:#d4442c;--ok:#2f7f45;--blue:#2f6fd1;--yellow:#f6cf3a;
  --f-d:"Bricolage Grotesque",system-ui,sans-serif;--f-b:"Figtree",system-ui,sans-serif;--f-m:"JetBrains Mono",monospace;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--f-b)}
.bar{border-bottom:1px solid var(--hair)}
.bar .in{max-width:1120px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;font:700 20px var(--f-d)}
.mark{width:24px;height:24px;border-radius:50%;border:7px solid var(--accent)}
.right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:6px 14px;border-radius:999px;border:2px solid var(--ink);background:#fff;color:var(--ink);font:600 14px var(--f-b);cursor:pointer;text-decoration:none}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.no{color:var(--accent);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
main{max-width:1120px;margin:0 auto;padding:24px 16px 48px;display:flex;flex-direction:column;gap:18px}
h1{font:800 32px/1.1 var(--f-d);letter-spacing:-.02em;margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:14px}
.stat b{display:block;font:800 30px var(--f-d)}
.stat span{color:var(--muted);font-size:13px}
.stat.pending{background:#fff7d1}
.filters{display:flex;gap:0;border:2px solid var(--ink);border-radius:999px;overflow:hidden;width:max-content;max-width:100%}
.filters button{border:0;background:transparent;padding:8px 14px;font:600 14px var(--f-b);cursor:pointer;color:var(--ink)}
.filters button[aria-pressed="true"]{background:var(--ink);color:#fff}
.list{display:flex;flex-direction:column;gap:10px}
.row{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center}
.who b{font-size:16px}
.who .u{font-family:var(--f-m);font-size:13px;color:var(--muted)}
.meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag{display:inline-block;font:700 11px var(--f-m);text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:999px;border:1.5px solid currentColor;margin-left:6px;vertical-align:2px}
.tag.pending{color:#9a6a00}.tag.approved{color:var(--ok)}.tag.rejected{color:var(--accent)}.tag.admin{color:var(--blue)}
@media (max-width:620px){.row{grid-template-columns:1fr}.acts{justify-content:flex-start}.stats{grid-template-columns:1fr 1fr 1fr}.stat b{font-size:24px}}
.empty,.gate{background:var(--card);border:2px dashed var(--hair);border-radius:14px;padding:20px;color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px}
</style>
</head>
<body>
<header class="bar"><div class="in">
  <a class="brand" href="./"><span class="mark" aria-hidden="true"></span>Boncuk Atölyesi</a>
  <div class="right"><span class="meta" id="me"></span><a class="btn" href="app.html">Uygulama</a><button class="btn" id="out">Çıkış</button></div>
</div></header>
<main id="main">
  <div class="gate" id="gate">Yükleniyor…</div>
</main>
<div class="toast" id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="auth.js?v=5"></script>
<script>
const $=id=>document.getElementById(id);
let rows=[],filter="pending",meId=null;
const LBL={pending:"Bekliyor",approved:"Onaylı",rejected:"Reddedildi"};
function toast(t){const e=$("toast");e.textContent=t;e.hidden=false;clearTimeout(e._t);e._t=setTimeout(()=>e.hidden=true,2600)}
const dt=s=>s?new Date(s).toLocaleString("tr-TR",{dateStyle:"medium",timeStyle:"short"}):"";
$("out").onclick=()=>baLogout("giris.html");

async function boot(){
  const p=await baCurrent();
  if(!p){location.replace("giris.html?next=admin");return}
  if(!p.profile||!p.profile.is_admin){$("gate").textContent="Bu sayfa yalnızca yöneticiler içindir.";return}
  meId=p.profile.id;$("me").textContent=p.profile.username;
  $("main").innerHTML=`<h1>Kullanıcılar</h1>
   <div class="stats"><div class="stat pending"><b id="nP">0</b><span>onay bekliyor</span></div><div class="stat"><b id="nA">0</b><span>onaylı</span></div><div class="stat"><b id="nR">0</b><span>reddedildi</span></div></div>
   <div class="filters" role="group" aria-label="Filtre"><button data-f="pending" aria-pressed="true">Bekleyenler</button><button data-f="approved" aria-pressed="false">Onaylılar</button><button data-f="rejected" aria-pressed="false">Reddedilenler</button><button data-f="all" aria-pressed="false">Tümü</button></div>
   <div class="list" id="list"></div>`;
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll("[data-f]").forEach(x=>x.setAttribute("aria-pressed",x===b));render()});
  await load();
  baClient.channel("profiles").on("postgres_changes",{event:"*",schema:"public",table:"profiles"},load).subscribe();
}
async function load(){
  const {data,error}=await baClient.from("profiles").select("*").order("created_at",{ascending:false});
  if(error){toast("Liste alınamadı: "+error.message);return}
  rows=data||[];render();
}
function render(){
  $("nP").textContent=rows.filter(r=>r.status==="pending").length;
  $("nA").textContent=rows.filter(r=>r.status==="approved").length;
  $("nR").textContent=rows.filter(r=>r.status==="rejected").length;
  const list=$("list");list.innerHTML="";
  const sel=rows.filter(r=>filter==="all"||r.status===filter);
  if(!sel.length){const d=document.createElement("div");d.className="empty";d.textContent=filter==="pending"?"Onay bekleyen kayıt yok.":"Bu listede kimse yok.";list.appendChild(d);return}
  sel.forEach(r=>{
    const row=document.createElement("div");row.className="row";
    const who=document.createElement("div");
    const b=document.createElement("b");b.textContent=r.full_name||r.username;
    const t=document.createElement("span");t.className="tag "+r.status;t.textContent=LBL[r.status];
    who.className="who";who.append(b,t);
    if(r.is_admin){const a=document.createElement("span");a.className="tag admin";a.textContent="Yönetici";who.append(a)}
    const u=document.createElement("div");u.className="u";u.textContent="@"+r.username;who.append(u);
    const meta=document.createElement("div");meta.className="meta";
    meta.textContent=[r.email&&!r.email.endsWith("@"+BA_CFG.domain)?r.email:"",`Kayıt: ${dt(r.created_at)}`,r.approved_at?`Onay: ${dt(r.approved_at)}`:""].filter(Boolean).join(" · ");
    who.append(meta);
    const acts=document.createElement("div");acts.className="acts";
    const mk=(txt,cls,fn,dis)=>{const x=document.createElement("button");x.className="btn "+cls;x.textContent=txt;x.disabled=!!dis;x.onclick=fn;acts.appendChild(x)};
    const self=r.id===meId;
    if(r.status!=="approved")mk("Onayla","ok",()=>setStatus(r,"approved"));
    if(r.status!=="rejected")mk("Reddet","no",()=>setStatus(r,"rejected"),self);
    if(r.status!=="pending"&&!self)mk("Beklemeye al","",()=>setStatus(r,"pending"));
    row.append(who,acts);list.appendChild(row);
  });
}
async function setStatus(r,s){
  const {error}=await baClient.from("profiles").update({status:s}).eq("id",r.id);
  if(error){toast("Kaydedilemedi: "+error.message);return}
  toast(`@${r.username}: ${LBL[s]}`);load();
}
boot();
</script>
</body>
</html>
